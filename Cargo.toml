[package]
name = "revsh"
version = "0.1.0"
edition = "2021"

[dependencies]
colored = "2"
base64 = { version = "0.21", features = ["std"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clipboard = { version = "0.5", optional = true }

[features]
default = ["clipboard"]
clipboard = ["dep:clipboard"]
